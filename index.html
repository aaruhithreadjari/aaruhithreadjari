<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aaruhi Thread And Jari</title>
<meta name="description" content="Aaruhi Thread And Jari – contact information.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6EE;--card:#FFFFFF;--text:#3B1F1A;--muted:#7A5C55;--accent:#8C1C2B;--accent2:#C89B3C;--line:rgba(0,0,0,.08)}
@media (prefers-color-scheme: dark){:root{--bg:#1C1110;--card:#281A18;--text:#F5E9E2;--muted:#BFA39B;--accent:#E0687A;--accent2:#D9B25A;--line:rgba(255,255,255,.1)}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Playfair Display', Georgia, serif;display:flex;align-items:center;justify-content:center;padding:24px 16px;line-height:1.5}
.card{background:var(--card);width:100%;max-width:520px;padding:48px 32px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.name{color:var(--accent);line-height:1.15}
.label{color:var(--muted);font-size:.85rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.btn{display:inline-block;margin-top:6px;padding:12px 22px;background:var(--accent);color:var(--card);text-decoration:none;font-weight:600;word-break:break-all;font-family:system-ui,sans-serif;font-size:.95rem}
.btn:hover{opacity:.9}
footer{margin-top:32px;color:var(--muted);font-size:.8rem;font-family:system-ui,sans-serif}

.card{border-top:4px solid var(--accent2);border-radius:4px}
.name{font-size:clamp(2rem,6vw,3rem);letter-spacing:.5px}
.rule{width:80px;height:2px;background:var(--accent2);margin:18px auto}

</style>
</head>
<body>
<main class="card">
<h1 class="name">Aaruhi Thread And Jari</h1>
<div class="rule" aria-hidden="true"></div>
<p class="label">Contact</p>
<a class="btn" href="mailto:developer@aaruhithreadandjari.top">developer@aaruhithreadandjari.top</a>
<footer>&copy; <span id="y"></span> Aaruhi Thread And Jari</footer>
</main>
<script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
